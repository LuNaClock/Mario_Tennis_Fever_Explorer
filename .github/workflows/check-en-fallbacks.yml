name: Check English HTML fallbacks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check-en-fallbacks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm run check:en-fallbacks
