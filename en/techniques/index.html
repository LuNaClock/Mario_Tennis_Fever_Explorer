<body data-route-section="techniques">

    </nav>

<section class="section" id="techniques" data-nav-label="Tips">
      <div class="section-header">
        <div>
          <h2>Tips</h2>
          <p class="section-description" data-i18n="section.tips.description">試合で役立つ操作のポイントを素早く確認できます。</p>
        </div>
      </div>
      <div class="filters tips-filters">
        <label class="filter">

          <select id="tips-category-filter">
            <option value="all" data-i18n="common.any">指定なし</option>
            <option value="仕様" data-i18n="tipsCategory.仕様">仕様</option>
            <option value="実践知識" data-i18n="tipsCategory.実践知識">実践知識</option>
          </select>
        </label>
        <label class="filter">
          <span data-i18n="filter.verification">検証</span>
          <select id="tips-verification-filter">
            <option value="all" data-i18n="common.any">指定なし</option>
            <option value="検証中" data-i18n="verification.検証中">検証中</option>
            <option value="検証済" data-i18n="verification.検証済">検証済</option>

        </label>
      </div>

      <p id="tips-count" class="result-count" aria-live="polite">0件表示</p>
      <div id="tips-list" class="tips-grid"></div>

      <div id="tips-empty" class="info-panel" hidden>

  <div class="tier-modal" id="tier-row-modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="tier-modal__panel">
      <div class="tier-modal__header">
        <h2 data-i18n="tier.modalTitle">Tier行を編集</h2>
        <button type="button" class="tier-modal__close" id="tier-row-modal-close" data-i18n-attr="aria-label:aria.close" aria-label="閉じる">✕</button>
      </div>

        <span data-i18n="tier.labelName">ラベル名</span>

        <button type="button" class="tier-modal__btn" id="tier-row-clear" data-i18n="tier.clearRow">行の中身をクリア</button>
        <button type="button" class="tier-modal__btn" id="tier-row-add-above" data-i18n="tier.addAbove">上に行追加</button>
        <button type="button" class="tier-modal__btn" id="tier-row-add-below" data-i18n="tier.addBelow">下に行追加</button>
        <button type="button" class="tier-modal__btn tier-modal__btn--danger" id="tier-row-delete" data-i18n="tier.deleteRow">行を削除</button>
      </div>
    </div>
  </div>
  <script type="module">
(async () => {
  const targetSectionId = "techniques";
  const isEnglishPath = window.location.pathname.startsWith('/en');
  const entryPath = isEnglishPath ? '/en/index.html' : '/index.html';
  const fallbackBase = isEnglishPath ? '/en/#' : '/#';

  try {
    const response = await fetch(entryPath, { credentials: 'same-origin' });
    if (!response.ok) throw new Error('index fetch failed');

    const html = await response.text();
    const parser = new DOMParser();
    const sourceDoc = parser.parseFromString(html, 'text/html');

    const currentMain = document.querySelector('main.container');
    const sourceMain = sourceDoc.querySelector('main.container');

    if (!currentMain || !sourceMain) throw new Error('main missing');

    const existingSectionIds = new Set(
      Array.from(currentMain.querySelectorAll('section[id]')).map((section) => section.id)
    );

    sourceMain.querySelectorAll('section[id]').forEach((section) => {
      if (!existingSectionIds.has(section.id)) {
        currentMain.append(document.importNode(section, true));
      }
    });

    document.body.dataset.routeSection = targetSectionId;
    await import('/js/main.js');
  } catch (error) {
    window.location.replace(fallbackBase + targetSectionId);
  }
})();
  </script>
</body>
